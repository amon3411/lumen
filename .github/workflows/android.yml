name: Build & release APK
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: '8.10.2' }
      - name: Read version
        id: v
        run: |
          V=$(grep -oP 'versionName = "\K[^"]+' app/build.gradle.kts)
          echo "version=$V" >> $GITHUB_OUTPUT
          if gh release view "v$V" >/dev/null 2>&1; then echo "exists=1" >> $GITHUB_OUTPUT; fi
      - name: Signing key
        if: steps.v.outputs.exists != '1'
        run: |
          test -n "$KEYSTORE_PASSWORD" || { echo "KEYSTORE_PASSWORD secret missing"; exit 1; }
          if ! gh release download signing-key -p release.jks 2>/dev/null; then
            keytool -genkeypair -keystore release.jks -alias lumen -keyalg RSA -keysize 4096 -validity 36500 \
              -storepass "$KEYSTORE_PASSWORD" -keypass "$KEYSTORE_PASSWORD" -dname "CN=Lumen"
            gh release create signing-key release.jks --draft --title "signing-key (do not delete or publish)" \
              --notes "Keeps updates installing over the existing app. Locked with KEYSTORE_PASSWORD."
          fi
      - name: Build
        if: steps.v.outputs.exists != '1'
        run: gradle :app:assembleRelease --no-daemon
      - name: Release
        if: steps.v.outputs.exists != '1'
        run: |
          V=${{ steps.v.outputs.version }}
          cp app/build/outputs/apk/release/app-release.apk lumen-$V.apk
          gh release create "v$V" lumen-$V.apk --title "Lumen $V" --notes-file .github/release-notes.md
